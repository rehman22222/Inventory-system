<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1e3b" />
    <meta
      name="description"
      content="Real-time stock control, a built-in POS, and role-based access in one system. Track SKUs, manage suppliers and orders, and close the month in minutes."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />

    <!--
      SEO. The canonical URL and og:url are injected at runtime by src/lib/useSeo.js
      rather than hardcoded here: this app is deployed per shop, and a canonical
      pointing at the wrong host would de-index the real site. useSeo resolves it
      from REACT_APP_SITE_URL, falling back to the actual serving origin.

      Everything below is host-independent, so it can safely be static — which
      matters because social scrapers (Slack, WhatsApp, Facebook) do not execute
      JavaScript and only ever see this file.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Eiretech" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="E360 Inventory Suite" />
    <meta
      property="og:title"
      content="E360 — Inventory Management &amp; POS Software"
    />
    <meta
      property="og:description"
      content="Real-time stock control, a built-in POS, and role-based access in one system. Track SKUs, manage suppliers and orders, and close the month in minutes."
    />
    <meta property="og:image" content="%PUBLIC_URL%/login-hero.png" />
    <meta property="og:locale" content="en_IE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="E360 — Inventory Management &amp; POS Software"
    />
    <meta
      name="twitter:description"
      content="Real-time stock control, a built-in POS, and role-based access in one system. Track SKUs, manage suppliers and orders, and close the month in minutes."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/login-hero.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.png" or "favicon.png", "%PUBLIC_URL%/favicon.png" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>E360 — Inventory Management &amp; POS Software</title>
  </head>
  <body>
    <noscript>
      <h1>E360 — Inventory Management &amp; POS Software</h1>
      <p>
        E360 by Eiretech is a single system for product businesses: real-time
        stock control, a built-in point of sale with barcode scanning and split
        payments, supplier and order management, analytics, role-based access,
        and a full audit log.
      </p>
      <p>This application requires JavaScript. Please enable it to continue.</p>
    </noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
